<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS 100 — Good Wishes</title>
<style>
  :root {
    --bg: #fdfaf5;
    --card: #ffffff;
    --ink: #1e242b;
    --muted: #5c6672;
    --accent: #1d4ed8;
    --accent-soft: #eff6ff;
    --warm: #b45309;
    --warm-soft: #fffbeb;
    --picked: #047857;
    --picked-soft: #ecfdf5;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .bg-vector {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-vector svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .vec-float-1 { animation: vecFloat1 18s ease-in-out infinite alternate; transform-origin: center; }
  .vec-float-2 { animation: vecFloat2 22s ease-in-out infinite alternate; transform-origin: center; }
  .vec-float-3 { animation: vecFloat3 26s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes vecFloat1 {
    0% { transform: translate(0px, 0px) scale(1); }
    100% { transform: translate(28px, 22px) scale(1.06); }
  }
  @keyframes vecFloat2 {
    0% { transform: translate(0px, 0px) scale(1); }
    100% { transform: translate(-24px, 30px) scale(1.08); }
  }
  @keyframes vecFloat3 {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    100% { transform: translate(18px, -22px) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .vec-float-1, .vec-float-2, .vec-float-3 { animation: none; }
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  .header {
    text-align: center;
    padding: 16px 0 20px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 5vw, 2rem);
    letter-spacing: -0.02em;
  }
  .subtitle {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
  }
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .field { margin-bottom: 16px; }
  .btn-primary {
    width: 100%;
    padding: 14px 18px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
  }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.65; cursor: wait; }
  .guest-row {
    text-align: center;
    margin-top: 14px;
  }
  .guest-link {
    background: none;
    border: none;
    padding: 6px 10px;
    font-size: 0.9rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }
  .guest-link:hover { color: var(--ink); }
  .error {
    margin-top: 14px;
    padding: 11px 14px;
    border-radius: 10px;
    background: #fef2f2;
    color: #b91c1c;
    font-size: 0.92rem;
    font-weight: 500;
    display: none;
  }
  .hidden { display: none !important; }

  /* Fake Python REPL Terminal */
  .term-card {
    background: #0f172a;
    color: #e2e8f0;
    border-radius: var(--radius);
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
    padding: 16px 18px 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 0.92rem;
    line-height: 1.6;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .term-card.fade-out {
    opacity: 0;
    transform: translateY(-6px);
  }
  .term-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.18);
  }
  .term-dots {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .term-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: inline-block;
  }
  .term-title {
    margin-left: 8px;
    font-size: 0.78rem;
    color: #94a3b8;
  }
  .term-skip {
    background: rgba(148, 163, 184, 0.16);
    color: #cbd5e1;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 8px;
    padding: 4px 11px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
  }
  .term-skip:hover { background: rgba(148, 163, 184, 0.28); color: #fff; }
  .term-body {
    min-height: 108px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .term-prompt { color: #38bdf8; }
  .term-out { color: #86efac; }
  .term-cursor {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: #38bdf8;
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Unlocked Header */
  .hero-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .avatar-box {
    flex-shrink: 0;
    width: 60px;
    height: 60px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    background: #fff;
  }
  .avatar-box svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .greeting {
    font-size: clamp(1.3rem, 4.5vw, 1.7rem);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .crew-pill {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .prof-card {
    background: linear-gradient(180deg, var(--warm-soft) 0%, #ffffff 100%);
    border: 1px solid #fde68a;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .prof-label {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--warm);
    margin-bottom: 6px;
  }
  .picked-card {
    background: linear-gradient(180deg, var(--picked-soft) 0%, #ffffff 100%);
    border: 1px solid #a7f3d0;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .picked-label {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--picked);
    margin-bottom: 6px;
  }
  .prof-name {
    font-family: Georgia, "Times New Roman", Cambria, serif;
    font-size: 1.18rem;
    font-weight: 700;
    color: #312e81;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .msg-body {
    white-space: pre-wrap;
    margin: 0;
    font-size: 0.98rem;
  }
  .signoff {
    margin-top: 12px;
    font-style: normal;
    font-family: Georgia, "Times New Roman", Cambria, serif;
    font-weight: 600;
    color: #475569;
    font-size: 0.94rem;
  }
  .section-title {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .notes-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 520px) {
    .notes-grid { grid-template-columns: 1fr 1fr; }
  }
  .note-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.08s, box-shadow 0.15s;
  }
  .note-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(29, 78, 216, 0.08);
  }
  .note-btn:active { transform: scale(0.99); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    max-width: 520px;
    width: 100%;
    max-height: 85dvh;
    overflow-y: auto;
    padding: 22px 20px 24px;
    box-shadow: 0 24px 48px rgba(15, 23, 42, 0.22);
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: none;
    background: #f3f4f6;
    color: var(--ink);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: #e5e7eb; }
  .modal-role {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #0f766e;
    margin-bottom: 4px;
  }
  .modal-name {
    font-family: Georgia, "Times New Roman", Cambria, serif;
    font-size: 1.32rem;
    font-weight: 700;
    color: #1e1b4b;
    margin: 0 36px 12px 0;
    letter-spacing: -0.01em;
  }
  .term-continue {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed rgba(148, 163, 184, 0.25);
    color: #94a3b8;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .term-continue strong { color: #e2e8f0; }
</style>
</head>

  <main class="wrap">
    <header class="header">
      <h1>End-of-Semester Good Wishes</h1>
      <p class="subtitle">A note from your professor, TAs, and TFs</p>
    </header>

    <section id="login-view" class="card">
      <form id="unlock-form" autocomplete="off">
        <div class="field">
          <label for="roll-input">Roll Number</label>
          <input id="roll-input" type="text" inputmode="numeric" placeholder="e.g. 29100000" required>
        </div>
        <div class="field">
          <label for="code-input">Personal Code</label>
          <input id="code-input" type="text" autocapitalize="characters" spellcheck="false" placeholder="e.g. K7F-Q9M" required>
        </div>
        <button id="unlock-btn" class="btn-primary" type="submit">Open My Notes</button>
        <div id="error-msg" class="error" role="alert">That roll number and code don't match.</div>
      </form>
      <div class="guest-row">
        <button id="guest-btn" class="guest-link" type="button">Continue as guest</button>
      </div>
    </section>

    <section id="terminal-view" class="term-card hidden" aria-label="Unlock animation">
      <div class="term-bar">
        <div class="term-dots">
          <span class="term-dot" style="background:#ef4444"></span>
          <span class="term-dot" style="background:#f59e0b"></span>
          <span class="term-dot" style="background:#10b981"></span>
          <span class="term-title">python3 — cs100.py</span>
        </div>
        <button id="skip-term-btn" class="term-skip" type="button">Skip</button>
      </div>
      <div id="term-body" class="term-body"></div>
      <div id="term-continue" class="term-continue hidden">
        <span>Press <strong>Enter</strong> (or tap anywhere) to open your notes</span>
      </div>
    </section>

    <section id="wishes-view" class="hidden">
      <div class="hero-row">
        <div id="avatar-box" class="avatar-box hidden" aria-hidden="true"></div>
        <div>
          <h2 id="greeting" class="greeting"></h2>
        </div>
      </div>
      <div id="prof-container"></div>
      <div id="picked-container"></div>
      <h3 id="notes-heading" class="section-title hidden">Notes from your TAs &amp; TFs</h3>
      <div id="notes-grid" class="notes-grid"></div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <div class="modal">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modal-role" class="modal-role"></div>
      <h3 id="modal-name" class="modal-name"></h3>
      <p id="modal-body" class="msg-body"></p>
      <div id="modal-signoff" class="signoff hidden"></div>
    </div>
  </div>

  ['#b45309', '#fef3c7'],
  ['#7c3aed', '#ede9fe'],
  ['#be123c', '#ffe4e6'],
  ['#0f766e', '#ccfbf1'],
  ['#c2410c', '#ffedd5'],
  ['#4338ca', '#e0e7ff']
];

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToHex(buf) {
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

async function gcmDecrypt(rawKeyBytes, packed) {
  const [ivB64, ctB64] = packed.split('.');
  const key = await crypto.subtle.importKey('raw', rawKeyBytes, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(ivB64) },
    key,
    b64ToBytes(ctB64)
  );
  return JSON.parse(td.decode(pt));
}

async function deriveBoxKey(roll, code) {
  const baseKey = await crypto.subtle.importKey(
    'raw',
    te.encode(roll + code),
    'PBKDF2',
    false,
    ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    {
      name: 'PBKDF2',
      salt: te.encode(VAULT.salt),
      iterations: VAULT.iter,
      hash: 'SHA-256'
    },
    baseKey,
    256
  );
  return new Uint8Array(bits);
}

function normalizeCode(raw) {
  const clean = raw.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (clean.length === 6) return clean.slice(0, 3) + '-' + clean.slice(3);
  return raw.trim().toUpperCase();
}

function seededRng(seedHex) {
  let state = parseInt(seedHex.slice(0, 8), 16) >>> 0;
  return function () {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = Math.imul(state ^ (state >>> 15), 1 | state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildIdenticonSvg(seedHex) {
  const bytes = [];
  for (let i = 0; i < seedHex.length; i += 2) {
    bytes.push(parseInt(seedHex.slice(i, i + 2), 16));
  }
  const [fg, bg] = AVATAR_PALETTE[bytes[0] % AVATAR_PALETTE.length];
  const size = 5;
  let rects = `<rect x="-1" y="-1" width="7" height="7" fill="${bg}"/>`;
  let bitIdx = 0;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < 3; x++) {
      const byteVal = bytes[1 + (bitIdx >> 3)];
      const on = (byteVal >> (bitIdx & 7)) & 1;
      bitIdx++;
      if (on) {
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fg}"/>`;
        if (x < 2) {
          rects += `<rect x="${size - 1 - x}" y="${y}" width="1" height="1" fill="${fg}"/>`;
        }
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 7 7" shape-rendering="crispEdges">${rects}</svg>`;
}

const form = document.getElementById('unlock-form');
const rollInput = document.getElementById('roll-input');
const codeInput = document.getElementById('code-input');
const unlockBtn = document.getElementById('unlock-btn');
const guestBtn = document.getElementById('guest-btn');
const errorMsg = document.getElementById('error-msg');
const loginView = document.getElementById('login-view');
const terminalView = document.getElementById('terminal-view');
const termBody = document.getElementById('term-body');
const termContinue = document.getElementById('term-continue');
const skipTermBtn = document.getElementById('skip-term-btn');
const wishesView = document.getElementById('wishes-view');
const avatarBox = document.getElementById('avatar-box');
const greetingEl = document.getElementById('greeting');
const profContainer = document.getElementById('prof-container');
const pickedContainer = document.getElementById('picked-container');
const notesHeading = document.getElementById('notes-heading');
const notesGrid = document.getElementById('notes-grid');
const modalBackdrop = document.getElementById('modal-backdrop');
const modalClose = document.getElementById('modal-close');
const modalRole = document.getElementById('modal-role');
const modalName = document.getElementById('modal-name');
const modalBody = document.getElementById('modal-body');
const modalSignoff = document.getElementById('modal-signoff');

let terminalPlayed = false;

function openModal(item) {
  modalRole.textContent = item.role;
  modalName.textContent = item.name;
  modalBody.textContent = item.message;
  if (item.signoff) {
    modalSignoff.textContent = item.signoff;
    modalSignoff.classList.remove('hidden');
  } else {
    modalSignoff.classList.add('hidden');
  }
  modalBackdrop.classList.remove('hidden');
  modalClose.focus();
}

function closeModal() {
  modalBackdrop.classList.add('hidden');
}

modalClose.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modalBackdrop.classList.contains('hidden')) {
    closeModal();
  }
});

function renderWishes(opts) {
  const { isGuest, name, section, seed, messages } = opts;
  profContainer.innerHTML = '';
  pickedContainer.innerHTML = '';
  notesGrid.innerHTML = '';

  if (isGuest) {
    avatarBox.classList.add('hidden');
    greetingEl.textContent = 'Dear CS 100,';
  } else {
    avatarBox.innerHTML = buildIdenticonSvg(seed);
    avatarBox.classList.remove('hidden');
    greetingEl.textContent = `Dear ${name},`;
  }

  const profMsgs = messages.filter(m => m.role.toLowerCase() === 'professor');
  const staffMsgs = messages.filter(m => m.role.toLowerCase() !== 'professor');

  for (const pm of profMsgs) {
    const card = document.createElement('article');
    card.className = 'prof-card';
    const label = document.createElement('div');
    label.className = 'prof-label';
    label.textContent = 'From Your Professor';
    const pName = document.createElement('h3');
    pName.className = 'prof-name';
    pName.textContent = pm.name;
    const body = document.createElement('p');
    body.className = 'msg-body';
    body.textContent = pm.message;
    card.append(label, pName, body);
    if (pm.signoff) {
      const sign = document.createElement('div');
      sign.className = 'signoff';
      sign.textContent = pm.signoff;
      card.appendChild(sign);
    }
    profContainer.appendChild(card);
  }

  let remainingStaff = staffMsgs.slice();
  if (!isGuest && staffMsgs.length > 0) {
    const rng = seededRng(seed);
    const pickedIdx = Math.floor(rng() * staffMsgs.length);
    const picked = staffMsgs[pickedIdx];
    remainingStaff = staffMsgs.filter((_, idx) => idx !== pickedIdx);

    // Shuffle remaining notes deterministically per student
    for (let i = remainingStaff.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [remainingStaff[i], remainingStaff[j]] = [remainingStaff[j], remainingStaff[i]];
    }

    const pCard = document.createElement('article');
    pCard.className = 'picked-card';
    const pLabel = document.createElement('div');
    pLabel.className = 'picked-label';
    pLabel.textContent = 'A note picked for you';
    const pSender = document.createElement('h3');
    pSender.className = 'prof-name';
    pSender.textContent = `${picked.name} (${picked.role})`;
    const pBody = document.createElement('p');
    pBody.className = 'msg-body';
    pBody.textContent = picked.message;
    pCard.append(pLabel, pSender, pBody);
    if (picked.signoff) {
      const pSign = document.createElement('div');
      pSign.className = 'signoff';
      pSign.textContent = picked.signoff;
      pCard.appendChild(pSign);
    }
    pickedContainer.appendChild(pCard);
  }

  if (remainingStaff.length > 0) {
    notesHeading.textContent = isGuest ? 'Notes from TAs & TFs' : 'More notes from your TAs & TFs';
    notesHeading.classList.remove('hidden');
    for (const sm of remainingStaff) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'note-btn';
      btn.textContent = `💌 Note from ${sm.name}`;
      btn.addEventListener('click', () => openModal(sm));
      notesGrid.appendChild(btn);
    }
  } else {
    notesHeading.classList.add('hidden');
  }

  loginView.classList.add('hidden');
  terminalView.classList.add('hidden');
  wishesView.classList.remove('hidden');
}

function playTerminalThenRender(opts) {
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (terminalPlayed || reduceMotion) {
    terminalPlayed = true;
    renderWishes(opts);
    return;
  }
  terminalPlayed = true;
  loginView.classList.add('hidden');
  terminalView.classList.remove('hidden');

  const safeName = opts.name.replace(/"/g, '\\"');
  const steps = [
    { kind: 'type', prompt: '>>> ', text: `name = "${safeName}"`, pauseAfter: 350 },
    { kind: 'type', prompt: '>>> ', text: 'print(f"Good luck, {name}!")', pauseAfter: 320 },
    { kind: 'out', text: `Good luck, ${opts.name}!`, pauseAfter: 550 },
    { kind: 'type', prompt: '>>> ', text: 'exit()', pauseAfter: 350 }
  ];

  // Slower, deliberate typing speed (~4.5-5s) and stay open until user continues
  const totalChars = steps.reduce((acc, s) => acc + (s.kind === 'type' ? s.text.length : 0), 0);
  const baseCharMs = Math.max(36, Math.min(68, Math.floor(2900 / Math.max(1, totalChars))));

  let cancelled = false;
  let waitingForUser = false;
  const timers = [];
  termContinue.classList.add('hidden');

  function onKeyOrTap(e) {
    if (!waitingForUser) return;
    if (e && e.type === 'keydown') {
      if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
    }
    finish();
  }

  function finish() {
    if (cancelled) return;
    cancelled = true;
    waitingForUser = false;
    timers.forEach(clearTimeout);
    document.removeEventListener('keydown', onKeyOrTap);
    terminalView.removeEventListener('click', onKeyOrTap);
    terminalView.classList.add('fade-out');
    setTimeout(() => {
      terminalView.classList.remove('fade-out');
      renderWishes(opts);
    }, 280);
  }

  skipTermBtn.onclick = (e) => {
    e.stopPropagation();
    finish();
  };

  const lines = [];
  function draw(cursor) {
    termBody.innerHTML = '';
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      const div = document.createElement('div');
      if (l.prompt) {
        const pSpan = document.createElement('span');
        pSpan.className = 'term-prompt';
        pSpan.textContent = l.prompt;
        div.appendChild(pSpan);
      }
      const tSpan = document.createElement('span');
      if (l.kind === 'out') tSpan.className = 'term-out';
      tSpan.textContent = l.text;
      div.appendChild(tSpan);
      if (cursor && i === lines.length - 1) {
        const c = document.createElement('span');
        c.className = 'term-cursor';
        div.appendChild(c);
      }
      termBody.appendChild(div);
    }
  }

  let stepIdx = 0;
  let charIdx = 0;

  function tick() {
    if (cancelled) return;
    if (stepIdx >= steps.length) {
      waitingForUser = true;
      termContinue.classList.remove('hidden');
      document.addEventListener('keydown', onKeyOrTap);
      terminalView.addEventListener('click', onKeyOrTap);
      return;
    }
    const step = steps[stepIdx];
    if (step.kind === 'out') {
      lines.push({ kind: 'out', text: step.text });
      draw(false);
      stepIdx++;
      timers.push(setTimeout(tick, step.pauseAfter));
      return;
    }
    if (charIdx === 0) {
      lines.push({ kind: 'type', prompt: step.prompt, text: '' });
    }
    if (charIdx < step.text.length) {
      lines[lines.length - 1].text += step.text[charIdx];
      charIdx++;
      draw(true);
      const jitter = Math.floor((Math.random() - 0.4) * 18);
      timers.push(setTimeout(tick, Math.max(12, baseCharMs + jitter)));
    } else {
      charIdx = 0;
      stepIdx++;
      draw(true);
      timers.push(setTimeout(tick, step.pauseAfter));
    }
  }

  tick();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  unlockBtn.disabled = true;
  unlockBtn.textContent = 'Unlocking...';

  try {
    const roll = rollInput.value.trim();
    const code = normalizeCode(codeInput.value);
    const digest = await crypto.subtle.digest('SHA-256', te.encode(VAULT.salt + roll));
    const lookupId = bytesToHex(digest);
    const packedBox = VAULT.boxes[lookupId];

    if (!packedBox) {
      await deriveBoxKey(roll, code);
      throw new Error('mismatch');
    }

    const boxKey = await deriveBoxKey(roll, code);
    const box = await gcmDecrypt(boxKey, packedBox);
    const data = await gcmDecrypt(b64ToBytes(box.k), VAULT.payload);
    playTerminalThenRender({
      isGuest: false,
      name: box.n,
      section: box.s,
      seed: box.seed,
      messages: data.messages
    });
  } catch (_) {
    errorMsg.textContent = "That roll number and code don't match.";
    errorMsg.style.display = 'block';
  } finally {
    unlockBtn.disabled = false;
    unlockBtn.textContent = 'Open My Notes';
  }
});

guestBtn.addEventListener('click', async () => {
  errorMsg.style.display = 'none';
  guestBtn.disabled = true;
  try {
    const gBox = await gcmDecrypt(b64ToBytes(VAULT.guest.k), VAULT.guest.box);
    const data = await gcmDecrypt(b64ToBytes(gBox.k), VAULT.payload);
    renderWishes({
      isGuest: true,
      name: '',
      section: '',
      seed: '',
      messages: data.messages
    });
  } catch (_) {
    errorMsg.textContent = 'Could not open guest view.';
    errorMsg.style.display = 'block';
  } finally {
    guestBtn.disabled = false;
  }
});
</script>
